# /etc/nginx/sites-available/avrix-europe  →  ln -s to sites-enabled, then: certbot --nginx -d avrix-europe.com -d www.avrix-europe.com
server {
    listen 80;
    server_name avrix-europe.com www.avrix-europe.com;
    client_max_body_size 20m;          # contact-list uploads

    # Basic hardening
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;       # large imports validate MX records
    }

    # Tracking pixel / clicks must never be cached by the proxy
    location ~ ^/(t|u|api/unsubscribe)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
